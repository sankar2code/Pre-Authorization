<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source packet</title>
    <style>
      body { margin: 0; background: #3a3a38; font-family: system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 10; padding: 8px 16px; background: #1f1f1e; color: #f2f2ef; font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
      header b { font-weight: 600; }
      header .sub { color: #b9b9b4; flex: 1 1 200px; min-width: 0; }
      header .controls { display: flex; gap: 8px; align-items: center; }
      header select, header input { background: #2c2c2a; color: #f2f2ef; border: 1px solid #55554f; border-radius: 6px; font: inherit; font-size: 12px; padding: 4px 6px; }
      header select { max-width: 230px; }
      header input { width: 46px; text-align: right; }
      header label { color: #b9b9b4; font-size: 12px; display: flex; gap: 6px; align-items: center; }
      #pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 0 40px; }
      .page { position: relative; box-shadow: 0 2px 10px rgba(0,0,0,.4); background: #fff; }
      .page canvas { display: block; }
      .page .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b9b9b4; font-size: 13px; }
      .hl { position: absolute; background: rgba(255, 213, 0, .45); border-radius: 2px; mix-blend-mode: multiply; outline: 2px solid rgba(214, 150, 0, .9); animation: pulse 1.4s ease-in-out 3; }
      @keyframes pulse { 50% { background: rgba(255, 213, 0, .8); } }
    </style>
  </head>
  <body>
    <header>
      <b id="title">Source packet</b>
      <span class="sub" id="sub"></span>
      <span class="controls">
        <select id="sections" aria-label="Jump to section"><option value="">Jump to section…</option></select>
        <label>Page <input id="pageInput" type="number" min="1" aria-label="Page number" /> <span id="pageTotal"></span></label>
      </span>
    </header>
    <div id="pages"></div>
    <script type="module" src="/src/packetViewer.js"></script>
  </body>
</html>
