<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source packet</title>
    <style>
      body { margin: 0; background: #3a3a38; font-family: system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 10; padding: 10px 16px; background: #1f1f1e; color: #f2f2ef; font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
      header b { font-weight: 600; }
      header span { color: #b9b9b4; }
      #pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px 0 40px; }
      .page { position: relative; box-shadow: 0 2px 10px rgba(0,0,0,.4); background: #fff; }
      .page canvas { display: block; }
      .hl { position: absolute; background: rgba(255, 213, 0, .45); border-radius: 2px; mix-blend-mode: multiply; outline: 2px solid rgba(214, 150, 0, .9); animation: pulse 1.4s ease-in-out 3; }
      @keyframes pulse { 50% { background: rgba(255, 213, 0, .8); } }
    </style>
  </head>
  <body>
    <header><b id="title">Source packet</b><span id="sub"></span></header>
    <div id="pages"></div>
    <script type="module" src="/src/packetViewer.js"></script>
  </body>
</html>
